<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定</title>
  <style>
    body { font-family: "YouTube Noto", Roboto, sans-serif; padding: 15px; width: 300px; color: #333; margin: 0; }
    h3 { margin-top: 0; border-bottom: 2px solid #f00; padding-bottom: 8px; font-size: 16px; margin-bottom: 15px; }
    .setting-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; cursor: pointer; font-size: 14px; }
    .note { font-size: 11px; color: #d32f2f; margin-top: 6px; line-height: 1.4; background: #ffebee; padding: 8px; border-radius: 4px; }
    input[type="range"] { width: 100%; cursor: pointer; accent-color: #f00; }
    
    .master-toggle { background: #f5f5f5; padding: 10px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 15px; }
    
    button { color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; font-size: 14px; }
    .btn-save { background: #000; margin-bottom: 15px; }
    .btn-save:hover { background: #333; }
    .btn-update { background: #1976d2; padding: 8px; font-size: 13px; }
    .btn-update:hover { background: #1565c0; }
    
    #update-status { font-size: 12px; margin-top: 8px; text-align: center; color: #333; line-height: 1.5; }
  </style>
</head>
<body>
  <h3>設定 (v1.2)</h3>

  <div class="setting-group master-toggle">
    <label style="margin-bottom: 0;">
      <input type="checkbox" id="master-enable" style="transform: scale(1.2); margin-right: 5px;"> 
      拡張機能を有効にする (ON/OFF)
    </label>
  </div>

  <div class="setting-group">
    <label for="opacity-slider">UIの透明度: <span id="opacity-val">1.0</span></label>
    <input type="range" id="opacity-slider" min="0.1" max="1.0" step="0.1" value="1.0">
  </div>

  <div class="setting-group">
    <label>
      <input type="checkbox" id="nico-enable"> ニコニコ動画でもUIを表示
    </label>
    <div class="note">
      ※ニコニコ動画ではシーク時の同期バグ等の仕様があるため、初期設定は「OFF」です。
    </div>
  </div>

  <button class="btn-save" id="save-btn">保存して閉じる</button>

  <hr style="border: none; border-top: 1px dashed #ccc; margin-bottom: 15px;">

  <!-- アップデート確認エリア -->
  <button class="btn-update" id="update-btn">🔄 最新アップデートを確認</button>
  <div id="update-status"></div>

  <script src="popup.js"></script>
</body>
</html>
